<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owners' Thoughts — Catan Strategy Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "297085e4953f4850bd93b36ed565a3b2"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

<header class="masthead shell">
  <a class="wordmark" href="/">Catan Strategy Group</a>
  <nav>
    <a class="microlabel" href="/#engagements">Projects</a>
    <a class="microlabel" href="/#mandates">Mandates</a>
    <a class="microlabel" href="/owners-thoughts/">Owners' Thoughts</a>
    <a class="microlabel" href="/#the-list">Request our help</a>
  </nav>
</header>

<main class="shell">
  <a class="back-link microlabel" href="/owners-thoughts/">← Back to Owners' Thoughts</a>
  <div class="page-hero" data-article-hero>
    <p class="microlabel">Loading…</p>
  </div>
  <div class="prose" data-article-body></div>
</main>

<footer class="site-footer shell">
  <span class="microlabel">© 2026 Catan Strategy Group</span>
  <span class="microlabel push-right"><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const heroEl = document.querySelector('[data-article-hero]');
    const bodyEl = document.querySelector('[data-article-body]');

    const slug = location.pathname.split('/').filter(Boolean).pop();
    const post = await fetchPostBySlug(slug);

    if (!post) {
      heroEl.innerHTML = '<p class="microlabel">Not found</p><h1>This article is not published yet.</h1>';
      document.title = "Owners' Thoughts — Catan Strategy Group";
      return;
    }

    document.title = post.title + " — Owners' Thoughts — Catan Strategy Group";
    heroEl.innerHTML = `
      <p class="microlabel">${post.tag || ''}</p>
      <h1>${post.title}</h1>
      <div class="article-meta">
        <span>${post.published_at ? new Date(post.published_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''}</span>
        <span>${post.read_time || ''}</span>
        <span>RB</span>
      </div>`;
    bodyEl.innerHTML = post.body_html || '';
  });
</script>
</body>
</html>
