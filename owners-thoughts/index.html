<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owners' Thoughts — Catan Strategy Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

<header class="masthead shell">
  <a class="wordmark" href="/">Catan Strategy Group</a>
  <nav>
    <a class="microlabel" href="/#engagements">Clientele</a>
    <a class="microlabel" href="/#mandates">Mandates</a>
    <a class="microlabel" href="/#the-list">The list</a>
  </nav>
</header>

<main class="shell">
  <a class="back-link microlabel" href="/">← Back home</a>
  <div class="page-hero">
    <p class="microlabel">Owners' Thoughts</p>
    <h1>Practical advice for small business owners</h1>
  </div>
  <ul class="thoughts-list" data-thoughts-index>
    <li class="microlabel">Loading…</li>
  </ul>
</main>

<footer class="site-footer shell">
  <span class="microlabel">© 2026 Catan Strategy Group</span>
  <span class="microlabel push-right"><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const container = document.querySelector('[data-thoughts-index]');
    const posts = await fetchPublishedPosts();
    if (!posts.length) {
      container.innerHTML = '<li class="microlabel">Nothing published yet.</li>';
      return;
    }
    container.innerHTML = posts
      .map((post) => {
        const title = document.createElement('div');
        title.textContent = post.title;
        const excerpt = document.createElement('div');
        excerpt.textContent = post.excerpt || '';
        return `
          <li>
            <a class="title" href="/owners-thoughts/${post.slug}/">${title.innerHTML}</a>
            <div class="thoughts-meta microlabel">
              <span>${post.tag || ''}</span>
              <span>${post.read_time || ''}</span>
            </div>
            <p class="prose" style="margin-top:10px;">${excerpt.innerHTML}</p>
          </li>`;
      })
      .join('');
  });
</script>
</body>
</html>
